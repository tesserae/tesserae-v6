    <title>Tesserae V6</title>
    <!-- A Tesserae link is mostly passed from one scholar to another, and until
         2026-09-08 it arrived in Slack, Teams or a mailing list as a bare
         address with no title, summary or image. These six lines are what a
         link preview reads. The description is deliberately concrete about the
         languages, because that is what decides whether a reader clicks. -->
    <meta name="description" content="Tesserae finds intertextual parallels — allusions, echoes and borrowings — across a corpus of classical and premodern literature in Latin, Greek, English, Coptic and Hebrew. Free and open for scholars.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tesserae">
    <meta property="og:title" content="Tesserae: intertext search for classical literature">
    <meta property="og:description" content="Find allusions, echoes and borrowings across 2,000 years of literature. Compare two texts, search the whole corpus, or match passages by what happens in them rather than by their wording.">
    <meta property="og:image" content="https://tesserae.caset.buffalo.edu/tesserae-icon.jpg">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="/favicon.ico" sizes="any">
