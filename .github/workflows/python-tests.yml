name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov bandit
          
      - name: Check Python syntax (compile all)
        run: |
          python -m py_compile main.py
          python -m compileall backend/ -q

      # tests/test_endpoints.py is excluded because it needs a database and a
      # built corpus index, neither of which exists here; it skips rather than
      # fails, but the skips are noise. It runs on the server, where those
      # exist. Everything else runs, including tests/test_search_reference.py,
      # which checks the reference search's machinery against a miniature
      # index. The reference search over the real corpus is
      # scripts/reference_search_check.py, run at the end of a deploy.
      - name: Run tests with pytest
        run: |
          pytest tests/ --ignore=tests/test_endpoints.py --cov=backend --cov-report=term-missing -v

      - name: Security scan (bandit)
        run: |
          bandit -r backend/ -ll -q --skip B404,B603,B607
