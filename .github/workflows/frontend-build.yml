name: Frontend Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          
      - name: Install dependencies
        run: npm ci
          
      - name: Build React App
        run: npm run build

      # Pinned to the code of 2026-10-12 by eslint-suppressions.json and the
      # warning count in package.json. Blocking.
      - name: Lint (ESLint)
        run: npm run lint

      # Vitest never ran here, so a stale snapshot or expectation passed the
      # build for weeks (found 2026-10-24, #1180). Blocking.
      - name: Unit tests (Vitest)
        run: npx vitest run
